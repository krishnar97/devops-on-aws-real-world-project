# BookNova — run all four microservices together with one command.
# Usage:
#   docker compose up --build      (build images and start everything)
#   docker compose ps              (see what is running)
#   docker compose down            (stop and remove everything)

name: booknova

services:
  # ---------- Front end (Python) ----------
  productpage:
    build:
      context: ./productpage
    container_name: productpage
    environment:
      PORT: "9080"
      DETAILS_HOST: details
      RATINGS_HOST: ratings
      REVIEWS_HOST: reviews
    ports:
      - "9080:9080"        # only this one is published to our EC2 / laptop
    depends_on:
      - details
      - ratings
      - reviews
    restart: always
    networks: [booknova-net]

  # ---------- Book details (Ruby) ----------
  details:
    build:
      context: ./details
    container_name: details
    expose:
      - "7070"             # internal only, reachable by name "details"
    restart: always
    networks: [booknova-net]

  # ---------- Ratings (Node.js) ----------
  ratings:
    build:
      context: ./ratings
    container_name: ratings
    environment:
      PORT: "9080"
    expose:
      - "9080"
    restart: always
    networks: [booknova-net]

  # ---------- Reviews (Java) ----------
  reviews:
    build:
      context: ./reviews
    container_name: reviews
    environment:
      SERVICE_VERSION: v1
    expose:
      - "9080"
    restart: always
    networks: [booknova-net]

# One private network so the services can find each other by name.
networks:
  booknova-net:
