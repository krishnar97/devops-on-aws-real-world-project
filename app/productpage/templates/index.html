<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookNova - {{ book.title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7fb; color: #222; }
        h1 { color: #6b3fa0; }
        .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); max-width: 600px; }
        .details td { padding: 4px 12px 4px 0; }
        .review { border-top: 1px solid #eee; padding: 10px 0; }
        .stars { color: #e0a800; }
    </style>
</head>
<body>
    <h1>BookNova</h1>
    <div class="card">
        <h2>{{ book.title }}</h2>
        <p><em>by {{ book.author }}</em></p>
        <table class="details">
            <tr><td><strong>Year</strong></td><td>{{ book.year }}</td></tr>
            <tr><td><strong>Pages</strong></td><td>{{ book.pages }}</td></tr>
            <tr><td><strong>Language</strong></td><td>{{ book.language }}</td></tr>
            <tr><td><strong>Publisher</strong></td><td>{{ book.publisher }}</td></tr>
        </table>

        <h3>Reviews</h3>
        {% for review in reviews %}
        <div class="review">
            <strong>{{ review.reviewer }}</strong>
            <span class="stars">{{ "★" * review.rating }}{{ "☆" * (5 - review.rating) }}</span>
            <p>{{ review.text }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
